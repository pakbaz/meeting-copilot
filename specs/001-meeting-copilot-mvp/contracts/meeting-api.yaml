openapi: 3.0.3
info:
  title: Meeting Copilot API
  description: REST API for meeting management in Meeting Copilot MVP
  version: 1.0.0
  contact:
    name: Meeting Copilot Team

servers:
  - url: /api/v1
    description: API base path

tags:
  - name: Meetings
    description: Meeting lifecycle management
  - name: Speakers
    description: Speaker identification and management
  - name: Insights
    description: Key points, action items, and research results

paths:
  /meetings:
    get:
      tags: [Meetings]
      operationId: listMeetings
      summary: List user's meetings
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [setup, active, ended, archived]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of meetings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeetingSummary'
                  total:
                    type: integer
    post:
      tags: [Meetings]
      operationId: createMeeting
      summary: Create a new meeting (pre-meeting setup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingRequest'
      responses:
        '201':
          description: Meeting created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          $ref: '#/components/responses/BadRequest'

  /meetings/{meetingId}:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Meetings]
      operationId: getMeeting
      summary: Get meeting details
      responses:
        '200':
          description: Meeting details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Meetings]
      operationId: updateMeeting
      summary: Update meeting details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeetingRequest'
      responses:
        '200':
          description: Meeting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/start:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    post:
      tags: [Meetings]
      operationId: startMeeting
      summary: Start the meeting (transitions to active state)
      description: |
        Transitions meeting from 'setup' to 'active' state.
        Initiates real-time transcription via SignalR.
        FR-006: Start Meeting button transitions to in-meeting screen.
      responses:
        '200':
          description: Meeting started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          description: Meeting not in setup state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/end:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    post:
      tags: [Meetings]
      operationId: endMeeting
      summary: End the meeting and generate summary
      description: |
        Transitions meeting from 'active' to 'ended' state.
        Triggers summary generation (FR-051).
        SC-010: Summary generated within 10 seconds.
      responses:
        '200':
          description: Meeting ended with summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingEndResponse'
        '400':
          description: Meeting not in active state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/speakers:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Speakers]
      operationId: listSpeakers
      summary: List speakers in a meeting
      responses:
        '200':
          description: List of speakers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Speaker'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/speakers/{speakerId}:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
      - $ref: '#/components/parameters/SpeakerId'
    patch:
      tags: [Speakers]
      operationId: updateSpeaker
      summary: Update speaker details (name, role, company)
      description: |
        Updates speaker information via /speaker command (FR-019).
        FR-068: User can tag speakers with role and company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpeakerRequest'
      responses:
        '200':
          description: Speaker updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speaker'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/insights:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Insights]
      operationId: listInsights
      summary: List insights for a meeting
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [key_point, action_item, parking_lot, research_result]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insight'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/insights/key-points:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Insights]
      operationId: getKeyPoints
      summary: Get top 5 key points (FR-024)
      description: |
        Returns top 5 key points ranked by priority score.
        FR-024: Only top 5 by importance shown.
      responses:
        '200':
          description: Top 5 key points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insight'
                maxItems: 5
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/insights/action-items:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Insights]
      operationId: getActionItems
      summary: Get action items for meeting
      description: |
        Returns all action items with owners (FR-037, FR-038).
      responses:
        '200':
          description: Action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/research:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    post:
      tags: [Insights]
      operationId: requestResearch
      summary: Request research on a topic
      description: |
        Triggers Research Agent to fetch information (FR-031).
        Equivalent to /research {topic} command (FR-043).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Research topic or question
                  maxLength: 500
      responses:
        '202':
          description: Research request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending]
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/transcript:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Meetings]
      operationId: getTranscript
      summary: Get full meeting transcript
      description: |
        Returns all utterances with speaker labels (FR-052).
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [full, key_points]
            default: full
          description: |
            full: Complete transcript (FR-052)
            key_points: Only significant moments (FR-053)
      responses:
        '200':
          description: Meeting transcript
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/summary:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Meetings]
      operationId: getMeetingSummary
      summary: Get meeting summary
      description: |
        Returns comprehensive meeting summary (FR-051).
        Only available after meeting ends.
      responses:
        '200':
          description: Meeting summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '400':
          description: Meeting not ended yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpeakerId:
      name: speakerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    CreateMeetingRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          description: Meeting title (FR-002)
        description:
          type: string
          description: Rich text/markdown context (FR-004)
        agenda_items:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
              order:
                type: integer
        microphone_device_id:
          type: string
          description: Selected microphone device ID (FR-003)
        language:
          type: string
          default: en-US

    UpdateMeetingRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        agenda_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              order:
                type: integer

    Meeting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [setup, active, ended, archived]
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        agenda_items:
          type: array
          items:
            $ref: '#/components/schemas/AgendaItem'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        language:
          type: string

    MeetingSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [setup, active, ended, archived]
        created_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer

    MeetingEndResponse:
      type: object
      properties:
        meeting:
          $ref: '#/components/schemas/Meeting'
        summary:
          $ref: '#/components/schemas/SessionSummary'

    AgendaItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        order:
          type: integer
        status:
          type: string
          enum: [pending, in_progress, completed]
        summary:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        uploaded_at:
          type: string
          format: date-time

    Speaker:
      type: object
      properties:
        id:
          type: string
          format: uuid
        speaker_label:
          type: string
          description: Initial label (Speaker 1, etc.)
        display_name:
          type: string
          description: Inferred or set name
        role:
          type: string
        company:
          type: string
        is_self:
          type: boolean
        priority_rank:
          type: integer

    UpdateSpeakerRequest:
      type: object
      properties:
        display_name:
          type: string
        role:
          type: string
        company:
          type: string

    Insight:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [key_point, action_item, parking_lot, research_result]
        title:
          type: string
        content:
          type: string
        priority_score:
          type: number
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time

    ActionItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        owner_name:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]
        due_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Transcript:
      type: object
      properties:
        meeting_id:
          type: string
          format: uuid
        utterances:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              speaker_name:
                type: string
              content:
                type: string
              timestamp:
                type: string
                format: date-time

    SessionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        executive_summary:
          type: string
        key_takeaways:
          type: array
          items:
            type: string
        topics_covered:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              summary:
                type: string
              duration_seconds:
                type: integer
        agenda_completion_rate:
          type: number
        total_utterances:
          type: integer
        total_duration_seconds:
          type: integer
        action_items:
          type: array
          items:
            $ref: '#/components/schemas/ActionItem'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
